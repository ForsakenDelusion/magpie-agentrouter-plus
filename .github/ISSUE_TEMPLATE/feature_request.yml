name: 功能建议
description: 描述本 fork 要解决的问题、建议方案与兼容性影响。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索本仓库已有建议，并阅读 [兼容边界](https://github.com/ForsakenDelusion/magpie-agentrouter-plus/blob/main/docs/OPTIMIZATION.md)。维护者为 ForsakenDelusion，PR 目标分支为 main。
        不接受删除不透明 reasoning、工具或引用历史制造成功，或自动重试失败请求的方案。安全漏洞按 [安全政策](https://github.com/ForsakenDelusion/magpie-agentrouter-plus/blob/main/SECURITY.md) 私密报告。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明场景、当前限制及影响；不要包含真实对话、凭据或账户配置。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望行为、范围及可验证条件；区分提议、已实现和已验证，不声称免费额度或服务恢复。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明现有能力为何不足；路由建议先检查 use-domestic-api 与旧 endpoint/apiBase 覆盖，没有替代方案则注明。
    validations:
      required: false
  - type: textarea
    id: compatibility
    attributes:
      label: 风险与兼容性
      description: 说明 role/phase、工具／引用、不透明状态、请求快照、账户站点／凭据边界、旧配置与回退的影响；不影响也解释原因。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索本仓库已有 Issue，并阅读相关兼容边界。
          required: true
        - label: 我确认未提交真实凭据、Cookie、Token 或用户对话。
          required: true
